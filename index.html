<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRYBOT · Brief in. Campaign out.</title>
<meta name="description" content="Facebook and Instagram ads for local service businesses. New site coming soon.">
<meta name="theme-color" content="#070B14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;background:radial-gradient(60% 50% at 50% 45%,rgba(34,211,238,.14),transparent 70%),#070B14;color:#E8EEF8;font:16px/1.6 Inter,system-ui,sans-serif;padding:24px;text-align:center}
.logo{display:inline-flex;align-items:center;gap:10px;font:700 18px "Space Grotesk",sans-serif;letter-spacing:.12em;margin-bottom:28px}
.core{width:12px;height:12px;border-radius:50%;background:#22D3EE;box-shadow:0 0 14px 3px rgba(34,211,238,.8);animation:p 2.4s ease-in-out infinite}
@keyframes p{50%{box-shadow:0 0 26px 8px rgba(34,211,238,.9);transform:scale(1.15)}}
h1{font:700 clamp(44px,9vw,92px)/1.02 "Space Grotesk",sans-serif;letter-spacing:-.03em}
h1 span{background:linear-gradient(92deg,#fff 10%,#22D3EE 60%,#F5C451);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin-top:22px;color:#93A3BC;font-size:clamp(16px,2vw,19px)}
@media(prefers-reduced-motion:reduce){.core{animation:none}}
</style>
</head>
<body>
<main>
  <div class="logo"><span class="core"></span>BRYBOT</div>
  <h1>Brief in.<br><span>Campaign out.</span></h1>
  <p>Ads for local service businesses. New site coming soon.</p>
</main>
</body>
</html>
