<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRYBOT · Brief in. Campaign out.</title>
<meta name="description" content="Ads for local service businesses. Brief in. Campaign out.">
<meta name="theme-color" content="#03060C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#03060C;--ink:#D8F6FF;--dim:#5B7A93;--cyan:#22D3EE;--line:rgba(34,211,238,.18)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.5 "JetBrains Mono",ui-monospace,Menlo,monospace;overflow:hidden}
.stage{position:fixed;inset:0;background:radial-gradient(70% 60% at 62% 40%,#071a2c 0%,#040b16 55%,var(--bg) 100%)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#glow{filter:blur(7px) saturate(1.5);opacity:1;mix-blend-mode:screen;pointer-events:none}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.75) 100%)}
.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}

.hud{position:fixed;top:18px;left:22px;right:22px;display:flex;justify-content:space-between;gap:16px;color:var(--dim);font-size:11px;letter-spacing:.04em;z-index:3;pointer-events:none}
.hud b{color:#9FDDEB;font-weight:600}
.brand{display:flex;align-items:center;gap:9px;color:var(--ink);font-weight:800;letter-spacing:.18em;font-size:13px;margin-bottom:6px}
.core{width:9px;height:9px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px 3px rgba(34,211,238,.85);animation:p 1.8s ease-in-out infinite}
@keyframes p{50%{transform:scale(1.35);box-shadow:0 0 20px 6px rgba(34,211,238,.95)}}

.copy{position:fixed;left:22px;bottom:26px;z-index:3;max-width:min(820px,calc(100% - 44px))}
.copy .tag{color:var(--cyan);font-size:11px;letter-spacing:.22em;text-transform:uppercase}
.copy h1{font-weight:800;font-size:clamp(34px,6vw,76px);line-height:.98;letter-spacing:-.03em;margin:12px 0 14px;text-shadow:0 0 30px rgba(34,211,238,.35)}
.copy h1 span{color:var(--cyan)}
.copy p{color:#8FB0C6;font-size:clamp(13px,1.3vw,15px)}
.cursor{display:inline-block;width:.55em;height:1em;background:var(--cyan);vertical-align:-2px;margin-left:4px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.term{position:fixed;right:22px;bottom:26px;width:min(470px,40vw);z-index:3;border:1px solid var(--line);border-radius:10px;background:rgba(3,10,18,.72);backdrop-filter:blur(6px);overflow:hidden;box-shadow:0 20px 60px -20px rgba(0,0,0,.9)}
.term .bar{display:flex;align-items:center;gap:7px;padding:8px 12px;border-bottom:1px solid var(--line);font-size:11px;color:#9FB8CB}
.dot{width:9px;height:9px;border-radius:50%}
.term .run{margin-left:auto;color:#6EE7A8}
.term .run::before{content:"● "}
.code{height:178px;overflow:hidden;font-size:10.5px;line-height:1.55;padding:8px 0;color:#6F8BA3;white-space:pre}
.code div{padding:0 12px;overflow:hidden;text-overflow:clip}
.code div.on{background:rgba(34,211,238,.10);color:#CFF4FF}
.code i{font-style:normal;color:#35506A;display:inline-block;width:34px}
@media(max-width:860px){.term{display:none}.hud .r{display:none}}
@media(prefers-reduced-motion:reduce){.core,.cursor{animation:none}}
</style>
</head>
<body>
<div class="stage" aria-hidden="true">
  <canvas id="ascii"></canvas>
  <canvas id="glow"></canvas>
  <div class="vignette"></div>
  <div class="scan"></div>
</div>

<div class="hud">
  <div>
    <div class="brand"><span class="core"></span>BRYBOT</div>
    <div>jelly.js &nbsp; depth <b id="h-depth">0</b> m &nbsp; pulse <b id="h-pulse">0</b> &nbsp; tentacles <b id="h-tent">0</b></div>
    <div>chars <b id="h-chars">0</b> &nbsp; grid <b id="h-grid">0</b></div>
  </div>
  <div class="r" style="text-align:right">t <b id="h-t">00.00</b>s<br><b id="h-fps">0</b> fps</div>
</div>

<main class="copy">
  <div class="tag">Ads for local service businesses</div>
  <h1>Brief in.<br><span>Campaign out.</span></h1>
  <p>New site coming soon<span class="cursor"></span></p>
</main>

<div class="term" aria-hidden="true">
  <div class="bar"><span class="dot" style="background:#FF5F57"></span><span class="dot" style="background:#FEBC2E"></span><span class="dot" style="background:#28C840"></span>&nbsp; jelly.js<span class="run" id="t-fps">running</span></div>
  <div class="code" id="code"></div>
</div>

<script id="sim">
// jelly.js: an ASCII jellyfish. Every character is placed by this script.
// 1. the bell pulses; each contraction lifts it a little
// 2. tentacles are chains of points: they lag behind, sag and drift in the current
// 3. everything adds light into a grid; brighter cells get denser characters
const RAMP = " .,:;-=+*oa#%0@";
const A = document.getElementById("ascii"), ax = A.getContext("2d");
const G = document.getElementById("glow"), gx = G.getContext("2d");
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
let W, H, cw, chH, cols, rows, light, lvl, dpr, R0;
let mouse = { x: -1e4, y: -1e4 };
const TENT = 22, SEGS = 26;
let tent = [], snow = [];

function palette(n) {
  // deep sea blue -> brand cyan -> white-hot
  const out = [];
  for (let i = 0; i < n; i++) {
    const k = i / (n - 1);
    const a = k < .55 ? k / .55 : 1, b = k < .55 ? 0 : (k - .55) / .45;
    const r = 18 + 16 * a + 200 * b, g = 60 + 151 * a + 40 * b, bl = 120 + 118 * a + 17 * b;
    out.push(`rgb(${r | 0},${g | 0},${bl | 0})`);
  }
  return out;
}
const COLORS = palette(RAMP.length);

function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cw = W < 700 ? 6 : 8; chH = Math.round(cw * 1.62);
  cols = Math.ceil(W / cw); rows = Math.ceil(H / chH);
  light = new Float32Array(cols * rows); lvl = new Uint8Array(cols * rows);
  A.width = W * dpr; A.height = H * dpr; ax.setTransform(dpr, 0, 0, dpr, 0, 0);
  G.width = W / 2; G.height = H / 2;
  R0 = Math.max(60, Math.min(170, Math.min(W, H) * .17));
  tent = [];
  for (let k = 0; k < TENT; k++) {
    const pts = [];
    for (let i = 0; i < SEGS; i++) pts.push({ x: W * .6, y: H * .4 + i * 6, px: W * .6, py: H * .4 + i * 6 });
    tent.push(pts);
  }
  snow = Array.from({ length: Math.round(cols * rows / 110) }, () => ({ x: Math.random() * W, y: Math.random() * H, s: .15 + Math.random() * .5, p: Math.random() * 6.28 }));
  document.getElementById("h-grid").textContent = cols + "x" + rows;
}

function add(x, y, v) {
  const c = x / cw | 0, r = y / chH | 0;
  if (c >= 0 && c < cols && r >= 0 && r < rows) light[r * cols + c] += v;
}
function blob(x, y, rad, v) {
  // soft round splat, radius in px
  const rc = Math.ceil(rad / cw) + 1, rr = Math.ceil(rad / chH) + 1;
  const c0 = x / cw | 0, r0 = y / chH | 0;
  for (let r = r0 - rr; r <= r0 + rr; r++) {
    if (r < 0 || r >= rows) continue;
    for (let c = c0 - rc; c <= c0 + rc; c++) {
      if (c < 0 || c >= cols) continue;
      const dx = (c + .5) * cw - x, dy = (r + .5) * chH - y, d = Math.hypot(dx, dy) / rad;
      if (d < 1) light[r * cols + c] += v * (1 - d * d);
    }
  }
}

function frame(t) {
  light.fill(0);
  // background: slow caustics and light shafts from the surface
  for (let r = 0; r < rows; r++) {
    const y = r * chH, fall = 1 - y / H;
    for (let c = 0; c < cols; c++) {
      const x = c * cw;
      const ca = Math.sin(x * .011 + t * .5) * Math.sin(y * .019 - t * .35) + Math.sin((x + y) * .007 + t * .27);
      let v = Math.max(0, ca - 1.6) * .1;
      v += Math.pow(Math.max(0, Math.sin(x * .0042 + Math.sin(t * .15) * 1.6)), 70) * .16 * fall * fall * fall;
      light[r * cols + c] = v;
    }
  }

  // the bell
  const phase = (t * .55) % 1;
  const squeeze = Math.pow(Math.max(0, Math.sin(phase * Math.PI * 2)), 2);
  const baseX = W * (W > 860 ? .64 : .5), baseY = H * (W > 860 ? .34 : .32);
  let jx = baseX + Math.sin(t * .13) * W * .06 + Math.sin(t * .31) * 18;
  let jy = baseY + Math.sin(t * .09) * H * .05 - squeeze * R0 * .14;
  const md = Math.hypot(mouse.x - jx, mouse.y - jy);
  if (md < 260) { jx -= (mouse.x - jx) / md * (260 - md) * .25; jy -= (mouse.y - jy) / md * (260 - md) * .25; }
  const R = R0 * (1 - .15 * squeeze), Hb = R0 * .98 * (1 + .13 * squeeze);
  const tilt = Math.sin(t * .37) * .12, ct = Math.cos(tilt), st = Math.sin(tilt);

  const c0 = Math.max(0, (jx - R * 1.45) / cw | 0), c1 = Math.min(cols - 1, (jx + R * 1.45) / cw | 0);
  const r0 = Math.max(0, (jy - Hb * 1.45) / chH | 0), r1 = Math.min(rows - 1, (jy + Hb * .55) / chH | 0);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    const dx = (c + .5) * cw - jx, dy = (r + .5) * chH - jy;
    const u = (dx * ct + dy * st) / R, v = (-dx * st + dy * ct) / Hb;
    const d = v < 0 ? Math.hypot(u, v) : Math.abs(u);
    let L = 0;
    if (d < 1 && v < .06) {
      const rim = Math.pow(Math.max(0, (d - .72) / .28), 2);
      const ang = Math.atan2(v, u);
      const rib = Math.pow(Math.abs(Math.cos(ang * 8 + Math.sin(t) * .2)), 10) * .32 * (1 - d * .4);
      const core = Math.exp(-(u * u + (v + .45) * (v + .45)) * 9) * (.22 + .2 * squeeze);
      const gonad = Math.pow(Math.max(0, Math.cos(ang * 4 + Math.PI / 2)), 6) * Math.exp(-Math.pow(d - .42, 2) * 40) * .35;
      L = .07 + rim * .85 + rib * .9 + core + gonad;
    } else if (d < 1.35 && v < .1) {
      L = (1.35 - d) / .35 * .14;         // halo
    }
    if (v >= .03 && v < .2 && Math.abs(u) < 1.02 && Math.abs(u) > .55) {   // frilly margin
      L += .26 * Math.max(0, Math.cos(u * Math.PI * 9 + t * 2.2)) * (1 - (v - .03) / .17);
    }
    if (L > 0) light[r * cols + c] += L;
  }

  const rim = k => {   // world position of a point along the bell's lower edge
    const u = (-.94 + 1.88 * k) * R, v = .08 * Hb;
    return { x: jx + u * ct - v * st, y: jy + u * st + v * ct };
  };

  // oral arms: four sinuous ribbons under the bell
  for (let k = 0; k < 4; k++) {
    const o = rim(.3 + k * .13);
    for (let i = 0; i <= 42; i++) {
      const s = i / 42;
      const x = o.x + Math.sin(s * 5.2 - t * 1.3 + k * 1.7) * R * .2 * s + (k - 1.5) * R * .18 * s;
      const y = o.y + s * R * 1.7 * (.92 + .08 * squeeze);
      blob(x, y, (1 - s) * R * .055 + cw * .8, .26 * (1 - s * .5));
    }
  }

  // tentacles: verlet chains hanging from the rim
  const seg = R0 * .085;
  for (let k = 0; k < TENT; k++) {
    const p = tent[k], a = rim(k / (TENT - 1));
    p[0].x = a.x; p[0].y = a.y;
    for (let i = 1; i < SEGS; i++) {
      const q = p[i];
      const vx = (q.x - q.px) * .965, vy = (q.y - q.py) * .965;
      q.px = q.x; q.py = q.y;
      q.x += vx + Math.sin(t * .7 + i * .22 + k * .9) * .09;
      q.y += vy + .32;
      const mx = q.x - mouse.x, my = q.y - mouse.y, m = Math.hypot(mx, my);
      if (m < 90) { q.x += mx / m * (90 - m) * .05; q.y += my / m * (90 - m) * .05; }
    }
    for (let it = 0; it < 3; it++) for (let i = 1; i < SEGS; i++) {
      const a1 = p[i - 1], b = p[i], dx = b.x - a1.x, dy = b.y - a1.y, d = Math.hypot(dx, dy) || 1;
      const f = (d - seg) / d;
      if (i === 1) { b.x -= dx * f; b.y -= dy * f; }
      else { a1.x += dx * f * .5; a1.y += dy * f * .5; b.x -= dx * f * .5; b.y -= dy * f * .5; }
    }
    for (let i = 0; i < SEGS; i++) {
      const s = i / SEGS;
      blob(p[i].x, p[i].y, cw * (1 - s * .35), .38 * (1 - s * .75));
    }
  }

  // marine snow
  for (const f of snow) {
    f.y += f.s; f.x += Math.sin(t * .5 + f.p) * .15;
    if (f.y > H) { f.y = -4; f.x = Math.random() * W; }
    add(f.x, f.y, .16 + .12 * Math.sin(t * 3 + f.p));
  }

  draw();
  return { squeeze, jy };
}

function draw() {
  const n = RAMP.length - 1;
  let chars = 0;
  for (let i = 0; i < light.length; i++) {
    const l = Math.min(n, Math.round(Math.pow(light[i], .8) * n));
    lvl[i] = l; if (l) chars++;
  }
  ax.clearRect(0, 0, W, H);
  ax.font = `${Math.round(chH * .92)}px "JetBrains Mono", ui-monospace, monospace`;
  ax.textBaseline = "top";
  for (let l = 1; l <= n; l++) {
    ax.fillStyle = COLORS[l];
    const ch = RAMP[l];
    for (let i = 0; i < lvl.length; i++) if (lvl[i] === l) ax.fillText(ch, (i % cols) * cw, (i / cols | 0) * chH);
  }
  gx.clearRect(0, 0, G.width, G.height);
  gx.drawImage(A, 0, 0, G.width, G.height);
  hud.chars = chars;
}

// ---- loop, HUD and the code window ----
const hud = { chars: 0 }, $ = id => document.getElementById(id);
let last = 0, start = performance.now(), fpsN = 0, fpsT = 0, beats = 0, wasSq = 0, visible = true;
function loop(now) {
  if (visible) {
    if (now - last >= 1000 / 30) {
      const t = (now - start) / 1000, s = frame(t);
      if (s.squeeze > .5 && wasSq <= .5) beats++;
      wasSq = s.squeeze; last = now; fpsN++;
      if (now - fpsT > 500) {
        const fps = Math.round(fpsN * 1000 / (now - fpsT)); fpsN = 0; fpsT = now;
        $("h-fps").textContent = fps; $("t-fps").textContent = `running  ${fps} fps`;
        $("h-t").textContent = t.toFixed(2).padStart(5, "0");
        $("h-chars").textContent = hud.chars; $("h-pulse").textContent = beats;
        $("h-depth").textContent = (412 + s.jy / H * 40).toFixed(1);
      }
    }
  }
  if (!still) requestAnimationFrame(loop);
}
addEventListener("resize", resize);
addEventListener("pointermove", e => { mouse.x = e.clientX; mouse.y = e.clientY; }, { passive: true });
addEventListener("pointerleave", () => { mouse.x = mouse.y = -1e4; });
document.addEventListener("visibilitychange", () => { visible = !document.hidden; });

(function codeWindow() {
  const src = $("sim").textContent.split("\n").filter(l => l.trim()).map(l => l.replace(/\s+$/, ""));
  const box = $("code"), shown = 11;
  let at = 0;
  function show() {
    box.innerHTML = "";
    for (let i = 0; i < shown; i++) {
      const n = (at + i) % src.length, d = document.createElement("div");
      const num = document.createElement("i"); num.textContent = n + 1;
      d.append(num, src[n]);
      if (i === 4) d.className = "on";
      box.append(d);
    }
    at = (at + 1) % src.length;
  }
  show(); if (!still) setInterval(show, 650);
})();

resize();
$("h-tent").textContent = TENT;
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
  if (still) { for (let i = 0; i < 90; i++) frame(i / 30); } else requestAnimationFrame(loop);
});
</script>
</body>
</html>
